[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeiq"
version = "1.0.0"
description = "ResumeIQ - AI Resume Intelligence & Job Matching Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "SQLAlchemy>=2.0.36",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "anthropic>=1.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0", "httpx>=0.27.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[project.scripts]
resumeiq = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["llm: tests that require a live ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
# SIM905: the multi-line `"""words""".split()` idiom keeps the stopword and
# action-verb lists readable and diff-friendly; a list literal collapses them
# onto a single 2000-character line.
ignore = ["E501", "SIM905", "B007"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = "^(tests|ui)/"

[tool.coverage.run]
source = ["app"]
